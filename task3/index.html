<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headphone Advertisement</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  height:300vh; /* scrolling space */
  background:linear-gradient(135deg,#000,#111,#000);
  overflow-x:hidden;
  color:white;
}

/* HERO */
.hero{
  position:fixed;
  height:100vh;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:0.4s ease;
}

/* Heading */
h1{
  font-size:4rem;
  letter-spacing:4px;
  background:linear-gradient(90deg,#00f5ff,#ff00c8);
  -webkit-background-clip:text;
  color:transparent;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #00f5ff; }
  to{ text-shadow:0 0 30px #ff00c8; }
}

p{
  margin-top:10px;
  opacity:.7;
  letter-spacing:2px;
}

/* PRODUCT CONTAINER */
.product-container{
  margin-top:50px;
  perspective:1000px;
  transition:0.5s ease;
}

/* Glass blur background */
.product-box{
  width:400px;
  height:400px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(0px);
  transition:0.6s ease;
}

.product-box img{
  width:100%;
  transition:0.6s ease;
}

/* Hover Effects */
.product-box:hover{
  backdrop-filter:blur(20px);
}

.product-box:hover img{
  transform:scale(1.2);
}

/* Button */
button{
  margin-top:40px;
  padding:12px 35px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#00f5ff,#ff00c8);
  color:white;
  cursor:pointer;
  transition:0.4s ease;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px #00f5ff;
}

@media(max-width:768px){
  h1{ font-size:2.5rem; }
  .product-box{ width:280px; height:280px; }
}
</style>
</head>

<body>

<section class="hero">

  <h1>X-BEATS PRO</h1>
  <p>Feel The Depth. Hear The Power.</p>

  <div class="product-container">
    <div class="product-box">
      <!-- Free working headphone image -->
      <img id="product" src="https://pngimg.com/uploads/headphones/headphones_PNG101982.png">
    </div>
  </div>

  <button>Buy Now</button>

</section>

<script>

/* Scroll Based 3D Rotation */

const product = document.getElementById("product");

window.addEventListener("scroll", () => {

  const scrollTop = window.scrollY;
  const maxScroll = document.body.scrollHeight - window.innerHeight;
  const scrollFraction = scrollTop / maxScroll;

  const rotateY = scrollFraction * 360;  // rotate full circle
  const rotateX = scrollFraction * 15;   // slight tilt

  product.style.transform = 
    `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;

});

</script>

</body>
</html>
